name: PRODX Production Quality & Cloud Deployment Gate

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-security-gate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify reproducible npm lockfile exists
        run: |
          test -f package-lock.json || {
            echo "::error::package-lock.json is missing. Generate and commit it from the reviewed package.json before CI can install deterministically."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Static Analysis
        run: npm run lint

      - name: Build Production Client Bundle
        run: npm run build

  postgres-migration-recovery-drill:
    name: PostgreSQL migration/invariant gate (blocked until executable runner exists)
    needs: quality-and-security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse placeholder migration gate
        run: |
          echo "::error::The repository currently has only sparse migration files and no executable migration-chain/checksum/recovery test runner. Do not report the migration gate as passed."
          exit 1

  docker-build-and-cloud-deploy:
    name: Build container and runtime smoke gate
    needs: postgres-migration-recovery-drill
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        run: docker build -t prodx-pos:${{ github.sha }} .

      - name: Refuse placeholder runtime smoke gate
        run: |
          echo "::error::No deployment target or executable smoke-test harness is configured. Do not report post-deploy verification as passed."
          exit 1
